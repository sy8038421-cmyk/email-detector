<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📧 Email Spam Detector</h1>
            <p>Check if an email is spam or legitimate</p>
        </header>

        <main>
            <form id="spamForm">
                <div class="form-group">
                    <label for="emailSubject">Subject (Optional)</label>
                    <input type="text" id="emailSubject" placeholder="Enter email subject...">
                </div>

                <div class="form-group">
                    <label for="emailBody">Email Content *</label>
                    <textarea id="emailBody" placeholder="Paste your email content here..." required></textarea>
                </div>

                <button type="submit" class="btn">Check for Spam</button>
            </form>

            <div id="result" class="result" style="display: none;">
                <h2 id="resultTitle"></h2>
                <p id="resultScore"></p>
                <div class="reasons">
                    <h3>Reasons:</h3>
                    <ul id="reasonsList"></ul>
                </div>
                <button id="resetBtn" class="btn-secondary">Check Another Email</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
